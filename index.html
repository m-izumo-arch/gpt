<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>医師スケジュール管理</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="page-header">
    <h1>医師スケジュール管理</h1>
  </header>

  <main class="layout">
    <section class="card">
      <h2>スケジュール登録</h2>
      <form id="scheduleForm" class="form">
        <div class="field-group">
          <label for="date">日付</label>
          <input type="date" id="date" name="date" required />
        </div>
        <div class="field-group">
          <label for="time">時間</label>
          <input type="time" id="time" name="time" required />
        </div>
        <div class="field-group">
          <label for="doctor">医師氏名</label>
          <input type="text" id="doctor" name="doctor" placeholder="例：山田 太郎" required />
        </div>
        <div class="field-group">
          <label for="department">診療科</label>
          <select id="department" name="department" required>
            <option value="">選択してください</option>
            <option value="内科">内科</option>
            <option value="外科">外科</option>
            <option value="小児科">小児科</option>
            <option value="整形外科">整形外科</option>
            <option value="産婦人科">産婦人科</option>
            <option value="眼科">眼科</option>
          </select>
        </div>
        <div class="field-group">
          <label for="type">種別</label>
          <select id="type" name="type" required>
            <option value="">選択してください</option>
            <option value="IC">IC</option>
            <option value="手術">手術</option>
            <option value="診察">診察</option>
            <option value="不在">不在</option>
          </select>
        </div>
        <div class="field-group">
          <label for="notes">メモ</label>
          <textarea id="notes" name="notes" rows="2" placeholder="任意で備考を入力"></textarea>
        </div>
        <button type="submit" class="primary-button">追加</button>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>スケジュール一覧</h2>
        <div class="filters">
          <label>
            診療科
            <select id="filterDepartment">
              <option value="all">すべて</option>
            </select>
          </label>
          <label>
            種別
            <select id="filterType">
              <option value="all">すべて</option>
              <option value="IC">IC</option>
              <option value="手術">手術</option>
              <option value="診察">診察</option>
              <option value="不在">不在</option>
            </select>
          </label>
        </div>
      </div>

      <section class="legend" aria-label="診療科カラー凡例">
        <h3>診療科の色分け</h3>
        <ul id="departmentLegend" class="legend-list"></ul>
      </section>

      <table class="schedule-table">
        <thead>
          <tr>
            <th>日付</th>
            <th>時間</th>
            <th>医師氏名</th>
            <th>診療科</th>
            <th>種別</th>
            <th>メモ</th>
          </tr>
        </thead>
        <tbody id="scheduleBody">
        </tbody>
      </table>

      <p id="emptyState" class="empty-state">登録されたスケジュールはありません。</p>
    </section>
  </main>

  <template id="rowTemplate">
    <tr>
      <td data-label="日付"></td>
      <td data-label="時間"></td>
      <td data-label="医師氏名"></td>
      <td data-label="診療科">
        <span class="department-pill"></span>
      </td>
      <td data-label="種別"></td>
      <td data-label="メモ"></td>
    </tr>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
